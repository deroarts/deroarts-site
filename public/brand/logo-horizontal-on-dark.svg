<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" role="img" aria-label="DeroArts">
  <!-- Feather symbol -->
  <g transform="translate(0, 4)">
    <!-- Feather quill body -->
    <path d="M32 6 C44 6, 56 14, 52 30 C48 46, 34 54, 20 58 C24 48, 26 38, 24 28 C22 18, 18 12, 32 6Z"
          fill="url(#greenGradientDark)" opacity="0.95"/>
    <!-- Feather spine/shaft -->
    <path d="M32 6 L18 62" stroke="#8FC603" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Feather tip -->
    <path d="M18 62 C16 64, 14 66, 12 64 C14 60, 16 58, 18 62Z"
          fill="#F8F6F6"/>
    <!-- Vane lines -->
    <path d="M28 18 C35 16, 44 18, 48 24" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M25 26 C32 22, 42 23, 48 28" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M23 34 C30 30, 40 30, 46 34" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M21 42 C26 39, 35 39, 40 42" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- "Dero" text in white -->
  <text x="72" y="38" font-family="Poppins, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F8F6F6" letter-spacing="-0.5">Dero</text>

  <!-- "Arts" text in green -->
  <text x="148" y="38" font-family="Poppins, system-ui, sans-serif" font-size="30" font-weight="700" fill="#8FC603" letter-spacing="-0.5">Arts</text>

  <!-- Underline flourish -->
  <path d="M72 46 Q160 50 220 46" stroke="url(#greenGradientDark)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <defs>
    <linearGradient id="greenGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FC603"/>
      <stop offset="100%" stop-color="#1E9E3D"/>
    </linearGradient>
  </defs>
</svg>
